<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      // Suppress benign [vite] websocket connection logging in container iframe preview
      (function() {
        function isViteMessage(arg) {
          if (!arg) return false;
          try {
            var str = typeof arg === 'string' ? arg : (arg.message || arg.stack || (typeof arg.toString === 'function' ? arg.toString() : ''));
            return str.indexOf('[vite]') !== -1 || (str.indexOf('vite') !== -1 && str.indexOf('websocket') !== -1);
          } catch(e) {
            return false;
          }
        }

        var origErr = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMessage(arguments[i])) return;
          }
          origErr.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMessage(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };

        var origLog = console.log;
        console.log = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMessage(arguments[i])) return;
          }
          origLog.apply(console, arguments);
        };

        var origInfo = console.info;
        console.info = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMessage(arguments[i])) return;
          }
          origInfo.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (isViteMessage(e.message) || isViteMessage(e.error)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteMessage(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Simple E2EE Chat</title>
    <meta name="description" content="Zero-knowledge end-to-end encrypted messaging with client-side RSA-OAEP SHA-256, AES-256-GCM, delivery receipts, and photo sharing." />

    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="E2EE Chat" />
    <meta name="application-name" content="Simple E2EE Chat" />
    <link rel="manifest" href="./manifest.webmanifest" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./pwa-512x512.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    
    <!-- OpenGraph / Social -->
    <meta property="og:title" content="Simple E2EE Chat" />
    <meta property="og:description" content="Zero-knowledge end-to-end encrypted messaging with client-side RSA-OAEP SHA-256, AES-256-GCM, delivery receipts, and photo sharing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
