name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK for Download
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/Indchat-debug.apk
          echo "Debug APK built successfully:"
          ls -lh apk-output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Indchat-debug-apk
          path: apk-output/Indchat-debug.apk
          retention-days: 30

      - name: Post Job Summary
        run: |
          echo "## 📱 Indchat Android Debug APK Ready!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The debug APK has been successfully compiled directly in GitHub Actions." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 How to Download & Install:" >> $GITHUB_STEP_SUMMARY
          echo "1. Scroll down to the **Artifacts** section at the bottom of this run summary." >> $GITHUB_STEP_SUMMARY
          echo "2. Click **Indchat-debug-apk** to download the zip file." >> $GITHUB_STEP_SUMMARY
          echo "3. Extract the zip to get \`Indchat-debug.apk\`." >> $GITHUB_STEP_SUMMARY
          echo "4. Send the APK to your mobile phone or download directly in your mobile browser." >> $GITHUB_STEP_SUMMARY
          echo "5. Tap the APK to install on Android (enable 'Install unknown apps' if prompted)." >> $GITHUB_STEP_SUMMARY
